name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET build, unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore StudentSync.slnx
      - run: dotnet build StudentSync.slnx --no-restore -c Release
      - name: Check formatting
        run: dotnet format StudentSync.slnx --verify-no-changes --no-restore --severity error
      - name: Unit tests
        run: dotnet test --project tests/StudentSync.UnitTests -c Release --no-build
      - name: Integration tests (SQL Server 2022 via Testcontainers)
        run: dotnet test --project tests/StudentSync.IntegrationTests -c Release --no-build
      - name: Vulnerable package check
        run: dotnet list StudentSync.slnx package --vulnerable --include-transitive

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: dotnet
    env:
      MSSQL_SA_PASSWORD: ${{ secrets.CI_SQL_PASSWORD || 'Ci-Only-Sql-Passw0rd!' }}
      JWT_SIGNING_KEY: ci-only-signing-key-0123456789-abcdefghijklmnopqrstuvwxyz
      DEMO_PASSWORD: Ci-Demo-Passw0rd
      DEMO_FORCE_PASSWORD_CHANGE: "false"
      E2E_PASSWORD: Ci-Demo-Passw0rd
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose --profile app up -d --build --wait
      - name: Seed demo data
        run: docker compose --profile app run --rm api seed-demo
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          # Visual baselines in the repo are macOS-rendered; generate Linux baselines before enabling them in CI.
          npx playwright test --grep-invert "Visual regression"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report

