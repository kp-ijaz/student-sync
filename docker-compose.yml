# Student Sync local infrastructure.
#   docker compose up -d postgres mailpit        -> dependencies only (run API/Web with dotnet)
#   docker compose --profile app up -d --build    -> full stack in containers
name: studentsync

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: StudentSync
      POSTGRES_USER: studentsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${DB_PORT:-15432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studentsync -d StudentSync"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    # Local SMTP sink: email is accepted and viewable at http://localhost:18025, never delivered externally.
    image: axllent/mailpit:v1.27
    ports:
      - "11025:1025"
      - "18025:8025"

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/StudentSync.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=StudentSync;Username=studentsync;Password=${POSTGRES_PASSWORD}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      Storage__Local__LocalRootPath: /app/storage
      Database__MigrateOnStartup: "true"
      Demo__Password: ${DEMO_PASSWORD:-}
      Demo__ForcePasswordChange: ${DEMO_FORCE_PASSWORD_CHANGE:-true}
      Cors__Origins__0: http://localhost:5090
    ports:
      - "5080:8080"
    volumes:
      - storage:/app/storage
      - apikeys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: src/StudentSync.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: http://api:8080
      Api__PublicBaseUrl: http://localhost:5080
    ports:
      - "5090:8080"
    volumes:
      - webkeys:/app/keys
      - websessions:/app/sessions
    depends_on:
      - api

volumes:
  pgdata:
  storage:
  apikeys:
  webkeys:
  websessions:
