#cloud-config
# First-boot setup for a Student Sync demo VM (Ubuntu 24.04 Minimal, 1 GB RAM): swap, Docker and Compose.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
runcmd:
  # 1 GB of RAM is tight for a .NET app; swap absorbs start-up peaks.
  - [sh, -c, "test -f /swapfile || (fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab)"]
  - [sh, -c, "echo 'vm.swappiness=20' > /etc/sysctl.d/60-studentsync.conf && sysctl --system"]
  - [usermod, -aG, docker, ubuntu]
  - [systemctl, enable, --now, docker]
  - [mkdir, -p, /opt/studentsync]
  - [chown, "ubuntu:ubuntu", /opt/studentsync]
  - [touch, /opt/studentsync/.cloud-init-done]
