# Student Sync demo environment - API VM (Oracle Always Free micro instance, 1 GB RAM + 2 GB swap).
# Usage on the VM:  docker compose -f compose.api.yml up -d
# Secrets come from api.env and postgres.env next to this file (see the *.env.example files); never commit them.
name: studentsync

services:
  postgres:
    image: postgres:18.7-alpine
    restart: unless-stopped
    env_file: postgres.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    # Sized for a 1 GB VM shared with the API: one institute, a handful of concurrent users.
    command: >
      postgres
      -c shared_buffers=64MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=40
      -c max_wal_size=256MB
      -c log_min_duration_statement=1000
    ports:
      # Loopback only: used for SSH-tunnelled maintenance. The API reaches it over the compose network.
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d StudentSync"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: studentsync-api:${IMAGE_TAG:-demo}
    restart: unless-stopped
    env_file: api.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # PostgreSQL is on this VM, so the Hangfire server can poll freely: reminders, exam finalising, recording
      # retention and the weekly digest run again (they were off while the database was serverless Azure SQL).
      # Set JOBS_MODE=Inline in /opt/studentsync/.env to turn the scheduler off if memory gets tight.
      Jobs__Mode: ${JOBS_MODE:-Hangfire}
      Database__MigrateOnStartup: "true"
      Storage__Local__LocalRootPath: /app/storage
      DOTNET_gcServer: "0"
      DOTNET_GCConserveMemory: "7"
    ports:
      # Reached by the web VM over the private subnet only; the VCN security list does not expose 8080 publicly.
      - "8080:8080"
    volumes:
      - storage:/app/storage
      - apikeys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 600m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  storage:
  apikeys:
  pgdata:
